name: Deploy Heal Yoga to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install repairs platform-specific optional entries omitted when
        # the lockfile was generated on macOS, while still honoring the lockfile.
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://drpeteryau.github.io/healyoga

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
